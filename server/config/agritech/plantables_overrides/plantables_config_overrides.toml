# Plantables Override Configuration
# Add custom crops, trees, soils, and fertilizers here without modifying the core config.
# Any entries here will override or extend existing configurations for the same items/blocks.
#
# IMPORTANT: Incorrect IDs will be skipped with a warning in both the main log and a
# dedicated error log file created in the plantables_config_logs directory.
#
# NOTES:
# - If a crop/tree already exists, its soils list will be EXTENDED, not replaced.
# - If you omit the 'drops' field, existing drops are preserved.
# - IDs use resource location format: "minecraft:dirt", not "dirt"
#
# [crops.my_crop]
# seed = "examplemod:my_seeds"
# soil = ["minecraft:farmland", "examplemod:rich_soil"]
# drops = [
#   { item = "examplemod:my_crop", min_count = 1, max_count = 3, chance = 1.0 },
#   { item = "examplemod:my_seeds", min_count = 1, max_count = 2, chance = 0.3 }
# ]
#
# [trees.my_tree]
# sapling = "examplemod:my_sapling"
# soil = ["minecraft:dirt"]
# drops = [
#   { item = "examplemod:my_log", min_count = 2, max_count = 6, chance = 1.0 },
#   { item = "examplemod:my_sapling", min_count = 1, max_count = 2, chance = 0.5 }
# ]
#
# [soils.my_soil]
# block = "examplemod:my_soil"
# growth_modifier = 1.5
#
# [fertilizers.my_fertilizer]
# item = "examplemod:my_fertilizer"
# speed_multiplier = 1.2
# yield_multiplier = 1.2

# Biomes O' Plenty sapling compatibility for Agritech planters
# Note: A few saplings in this BOP version don't have dedicated log items,
# so they use oak logs as fallback output.

[trees.bop_cypress]
sapling = "biomesoplenty:cypress_sapling"
soil = ["minecraft:dirt", "minecraft:grass_block", "minecraft:farmland", "farmersdelight:rich_soil_farmland"]
drops = [
    { item = "minecraft:oak_log", min_count = 2, max_count = 6, chance = 1.0 },
    { item = "biomesoplenty:cypress_sapling", min_count = 1, max_count = 2, chance = 0.5 },
    { item = "minecraft:stick", min_count = 1, max_count = 2, chance = 0.5 }
]

